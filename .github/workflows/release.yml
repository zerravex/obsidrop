name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Confirm interpreter version
        shell: python
        run: |
          import sys

          print(sys.version)
          if sys.version_info[:2] != (3, 14):
              raise SystemExit(
                  f"Expected Python 3.14, got {sys.version.split()[0]}"
              )

      - name: Install pinned build dependency
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Check compilation
        run: python -m compileall -q app.py obsidrop tests

      - name: Build portable release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            python scripts/build_release.py --tag $env:GITHUB_REF_NAME
          } else {
            python scripts/build_release.py
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: obsidrop-windows-x64
          path: |
            release/Obsidrop-v*-Windows-x64.zip
            release/Obsidrop-v*-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: obsidrop-windows-x64
          path: release-assets

      - name: Verify SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem -LiteralPath "release-assets" -Filter "*.zip" |
            Select-Object -First 1
          if ($null -eq $zip) {
            throw "No release ZIP was downloaded."
          }

          $checksumFile = "$($zip.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksumFile -PathType Leaf)) {
            throw "Checksum file not found: $checksumFile"
          }

          $parts = (Get-Content -LiteralPath $checksumFile -Raw).Trim() -split "\s+"
          if ($parts.Count -lt 2 -or $parts[1] -ne $zip.Name) {
            throw "The checksum file does not identify $($zip.Name)."
          }

          $expected = $parts[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 mismatch: expected $expected, got $actual"
          }
          Write-Host "SHA-256 verified: $actual"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem -LiteralPath "release-assets" -Filter "*.zip" |
            Select-Object -First 1
          if ($null -eq $zip) {
            throw "No release ZIP was found for publication."
          }

          $checksumFile = "$($zip.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksumFile -PathType Leaf)) {
            throw "Checksum file not found: $checksumFile"
          }

          gh release create $env:GITHUB_REF_NAME `
            $zip.FullName `
            $checksumFile `
            --verify-tag `
            --title "Obsidrop $env:GITHUB_REF_NAME" `
            --generate-notes
